name: Update Marketing Jobs

on:
  schedule:
    # 매일 오전 9시 (KST = UTC 00:00) 자동 실행
    - cron: "0 0 * * *"
  workflow_dispatch: # GitHub에서 수동으로 즉시 실행 가능

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run marketing jobs scraper
        run: python -m scraper.main

      - name: Commit updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/jobs.csv
          if git diff --cached --quiet; then
            echo "변경된 공고 데이터가 없습니다."
          else
            git commit -m "chore: update marketing jobs ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
